<!-- NumberBox UI update: Category & Range Folder structure -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NumberBox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#080b12;
    --card:rgba(17,24,39,0.88);
    --line:rgba(255,255,255,0.10);
    --text:#f8fafc;
    --muted:#94a3b8;
    --blue:#2563eb;
    --cyan:#06b6d4;
    --yellow:#f59e0b;
    --green:#22c55e;
    --red:#ef4444;
    --accent-grad:linear-gradient(135deg,#2563eb 0%,#06b6d4 100%);
    --page-bg:linear-gradient(180deg,#080b12 0%,#0b1220 100%);
  }
  :root[data-theme="navy"]{ --page-bg:linear-gradient(180deg,#080b12 0%,#0b1220 100%); }
  :root[data-theme="charcoal"]{ --page-bg:#141414; }
  :root[data-theme="slate"]{ --page-bg:#0f1419; }
  :root[data-theme="green"]{ --page-bg:#0a0f0c; }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;
    background:var(--page-bg);
    color:var(--text);font-family:'Inter',sans-serif;
    padding:20px 16px 60px;
  }
  .wrap{width:100%;max-width:680px;margin:0 auto;}
  
  .brand{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    margin-bottom:20px;
    gap:12px;
  }
  .brand-left{display:flex;flex-direction:column;gap:6px;min-width:0;}
  .dot-row{display:flex;gap:4px;flex-shrink:0;}
  .dot{width:8px;height:8px;border-radius:50%;}
  .dot.b{background:#2dd4bf;}
  .dot.r{background:var(--red);}
  .dot.y{background:var(--yellow);}
  .dot.g{background:var(--green);}
  .brand span{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;color:var(--muted);letter-spacing:0.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .brand-right {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: nowrap;
    overflow-x: auto;
    max-width: 100%;
  }

  h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(24px,6vw,30px);font-weight:700;margin:0 0 18px;}

  .search-box{
    display:flex;align-items:center;gap:10px;
    background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:12px;
    padding:12px 16px;margin-bottom:16px;
  }
  .search-box svg{flex-shrink:0;opacity:.6;}
  .search-box input{
    flex:1;background:none;border:none;outline:none;color:var(--text);
    font-family:'Inter',sans-serif;font-size:14.5px;
  }
  .search-box input::placeholder{color:#52665c;}

  .import-toggle{
    width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;
    background:var(--card);backdrop-filter:blur(12px);color:var(--text);font-family:'Space Grotesk',sans-serif;
    font-weight:700;font-size:15px;cursor:pointer;margin-bottom:12px;
    display:flex;align-items:center;justify-content:center;position:relative;
    text-align:center;
  }
  .import-toggle:hover{border-color:var(--cyan);}
  .import-toggle .arrow{position:absolute;right:16px;color:var(--muted);font-size:12px;}
  .import-box{
    background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:14px;
    padding:16px;margin-bottom:16px;
  }
  .import-box p.hint{font-size:12.5px;color:var(--muted);margin:0 0 10px;line-height:1.5;}
  .import-box textarea{
    width:100%;min-height:110px;background:#0d1411;border:1px solid var(--line);color:var(--text);
    font-family:'Space Grotesk',sans-serif;font-size:13.5px;padding:12px 14px;border-radius:10px;outline:none;
    resize:vertical;margin-bottom:10px;
  }
  .import-box textarea::placeholder{color:#52665c;font-family:'Inter',sans-serif;font-size:13px;}
  .import-box textarea:focus{border-color:var(--cyan);}

  .import-box button.extract-btn{
    width:100%;margin-top:4px;padding:12px;border:none;border-radius:10px;
    background:var(--accent-grad);color:#06120e;
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14.5px;cursor:pointer;
  }
  .import-note{font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.5;}

  .folder-list{display:flex;flex-direction:column;gap:10px;}
  .folder-card{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:14px;
    padding:16px 18px;cursor:pointer;transition:all .15s ease;
  }
  .folder-card:hover{border-color:var(--cyan);background:rgba(22,32,27,0.9);}
  
  .folder-card.visited{
    border-left: 4px solid var(--yellow);
    background: rgba(245, 158, 11, 0.05);
  }

  .folder-main{display:flex;align-items:center;gap:12px;min-width:0;flex:1;}
  .folder-dot{
    width:9px;height:9px;border-radius:50%;flex-shrink:0;
    background:var(--cyan);box-shadow:0 0 8px rgba(6,182,212,0.5);
  }
  .folder-text{min-width:0;flex:1;}
  .folder-name-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .folder-name{
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .folder-price-tag{
    font-size:11px;font-weight:600;color:var(--cyan);background:rgba(6,182,212,0.1);
    border:1px solid rgba(6,182,212,0.25);padding:1px 6px;border-radius:6px;
    font-family:'Space Grotesk',sans-serif;white-space:nowrap;
  }
  .folder-sub{font-size:11.5px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .folder-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .folder-count{
    background:rgba(6,182,212,0.12);border:1px solid rgba(6,182,212,0.3);color:var(--cyan);
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;
    min-width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    padding:0 4px;
  }
  .folder-count.new{
    background:rgba(245,158,11,0.15);border-color:var(--yellow);color:var(--yellow);
  }
  .folder-chevron{color:var(--muted);font-size:16px;}
  .folder-del{
    background:none;border:none;color:#52665c;font-size:16px;cursor:pointer;
    padding:4px 6px;border-radius:6px;
  }
  .folder-del:hover{color:var(--red);background:rgba(239,68,68,0.1);}

  .empty{color:#52665c;font-size:13.5px;text-align:center;padding:30px 0;}

  .back-row{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
  .back-btn{
    background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--line);color:var(--text);
    width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:16px;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .back-btn:hover{border-color:var(--cyan);}
  .folder-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:19px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  .upload-row{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap;}
  .toolbtn{
    background:rgba(24,34,29,0.8);border:1px solid var(--line);color:var(--muted);
    font-family:'Inter',sans-serif;font-size:12px;font-weight:500;
    padding:6px 10px;border-radius:8px;cursor:pointer;transition:all .15s ease;
    white-space:nowrap;
  }
  .toolbtn:hover{color:var(--text);border-color:#344a3e;}

  .sync-status-bar {
    font-size: 11.5px;
    color: var(--cyan);
    background: rgba(6,182,212,0.08);
    border: 1px solid rgba(6,182,212,0.2);
    padding: 6px 12px;
    border-radius: 8px;
    margin-bottom: 14px;
    display: none;
    align-items: center;
    justify-content: space-between;
  }

  .cc-row{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    margin-bottom:12px;padding:12px 14px;background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:10px;
  }
  .cc-label{font-size:12.5px;color:var(--muted);font-family:'Inter',sans-serif;margin-right:2px;}
  .cc-btn{
    background:#141f1a;border:1px solid var(--line);color:var(--text);
    font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;
    min-width:38px;padding:7px 10px;border-radius:8px;cursor:pointer;transition:all .15s ease;
  }
  .cc-btn:hover{border-color:var(--cyan);color:var(--cyan);}
  .cc-btn.active{border-color:var(--cyan);color:var(--cyan);background:rgba(6,182,212,0.1);}

  .actions-panel {
    background: var(--card);
    border: 1px solid var(--line);
    padding: 14px 16px;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 12px;
  }
  .top-action-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
  }
  .next-copy-btn{
    width: 100%;
    height: 52px;
    background:var(--accent-grad);
    color:#06120e;
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;
    padding:0 14px;border:none;border-radius:14px;cursor:pointer;
    box-shadow:0 4px 15px rgba(6, 182, 212, 0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    transition:transform .1s ease;
  }
  .next-copy-btn:active{transform:scale(0.98);}
  .counter-badge{
    position: absolute;
    right: 14px;
    font-size: 14px;
    color: #ffffff;
    font-weight: 600;
    pointer-events: none;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    font-family: 'Space Grotesk', sans-serif;
  }
  .bottom-action-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .action-sm-btn {
    background: #0b0f19;
    border: 1px solid var(--line);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 500;
    transition: background 0.2s;
  }
  .action-sm-btn:hover {
    background: #1e293b;
  }
  .clear-copy-btn {
    color: #f87171;
    border-color: rgba(248, 113, 113, 0.3);
  }

  .folder-meta{
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;
    margin-bottom:10px;font-size:12.5px;color:var(--muted);
  }
  .folder-meta .count{color:var(--text);font-weight:600;font-family:'Space Grotesk',sans-serif;}
  .toolgroup{display:flex;gap:8px;}

  .results-wrap{display:flex;align-items:flex-start;gap:8px;}
  .num-list{
    flex:1;min-width:0;
    max-height:310px;overflow-y:auto;
    display:flex;flex-direction:column;gap:8px;
    scroll-behavior: smooth;
  }
  .num-list::-webkit-scrollbar{width:6px;}
  .num-list::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}

  .scroll-controls{flex-shrink:0;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;}
  .scroll-btn{
    width:34px;height:34px;border-radius:8px;
    background:#141f1a;border:1px solid var(--line);color:var(--muted);
    font-size:13px;cursor:pointer;transition:all .15s ease;
    display:flex;align-items:center;justify-content:center;
  }
  .scroll-btn:hover{color:var(--text);border-color:var(--cyan);}

  .num-row{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:10px;
    padding:11px 16px;cursor:pointer;user-select:none;transition:all .15s ease;
  }
  .num-row:hover{background:rgba(22,32,27,0.9);}
  .num-idx{
    flex-shrink:0;color:var(--muted);font-size:12px;font-family:'Space Grotesk',sans-serif;
    min-width:24px;
  }
  .num-val{
    flex:1;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14.5px;word-break:break-all;
  }
  .new-badge{
    flex-shrink:0;background:var(--yellow);color:#1a1206;font-weight:800;font-size:10.5px;
    letter-spacing:0.03em;padding:4px 10px;border-radius:14px;font-family:'Space Grotesk',sans-serif;
  }
  .copied-tag{flex-shrink:0;color:#52665c;font-size:12px;font-weight:600;font-family:'Inter',sans-serif;min-width:44px;text-align:right;}

  .num-row.current-copy{
    background:#064e3b !important;
    border:2px solid #059669 !important;
    box-shadow:0 0 12px rgba(5, 150, 105, 0.4);
  }
  .num-row.current-copy .copied-tag{
    color:#34d399;
    font-weight:800;
  }
  .num-row.previous-copy{
    background:#7f1d1d !important;
    border:2px solid #dc2626 !important;
  }
  .num-row.previous-copy .copied-tag{
    color:#fca5a5;
    font-weight:700;
  }

  #loginModal{
    position:fixed;top:0;left:0;width:100%;height:100%;
    background:rgba(5,9,7,0.92);backdrop-filter:blur(16px);
    display:flex;align-items:center;justify-content:center;z-index:9999;
    padding:16px;
  }
  .login-card{
    width:100%;max-width:420px;
    background:linear-gradient(180deg, rgba(18,26,22,0.96) 0%, rgba(10,15,13,0.99) 100%);
    border:1px solid rgba(6,182,212,0.25);
    box-shadow:0 20px 40px rgba(0,0,0,0.6), 0 0 30px rgba(6,182,212,0.12);
    border-radius:24px;padding:32px 24px;text-align:center;position:relative;
  }
  .login-logo-circle{
    width:64px;height:64px;margin:0 auto 16px;border-radius:50%;
    background:rgba(6,182,212,0.1);border:1px solid rgba(6,182,212,0.3);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 20px rgba(6,182,212,0.2);
  }
  .login-logo-circle svg{width:28px;height:28px;color:var(--cyan);}
  .login-title{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;letter-spacing:0.05em;color:#fff;margin-bottom:4px;}
  .login-subtitle{font-size:12.5px;color:var(--muted);margin-bottom:24px;}
  
  .input-group{text-align:left;margin-bottom:16px;}
  .input-group label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;font-family:'Space Grotesk',sans-serif;letter-spacing:0.03em;}
  .input-field-wrap{position:relative;display:flex;align-items:center;}
  .input-group input{
    width:100%;background:#090d0b;border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;color:var(--text);font-family:'Inter',sans-serif;font-size:14px;outline:none;
    transition:border-color .2s;
  }
  .input-group input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(6,182,212,0.15);}
  .eye-btn{position:absolute;right:12px;background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;}

  .remember-row{display:flex;align-items:center;justify-content:space-between;margin:20px 0;font-size:12.5px;color:var(--muted);}
  .checkbox-label{display:flex;align-items:center;gap:8px;cursor:pointer;}
  .checkbox-label input{accent-color:var(--cyan);width:16px;height:16px;border-radius:4px;}
  .device-badge{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--yellow);}

  .enter-dash-btn{
    width:100%;padding:14px;border:none;border-radius:14px;
    background:var(--accent-grad);color:#06120e;font-family:'Space Grotesk',sans-serif;
    font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 8px 20px rgba(6,182,212,0.3);
    transition:transform .15s ease, box-shadow .15s ease;margin-bottom:20px;
  }
  .enter-dash-btn:hover{transform:translateY(-1px);box-shadow:0 12px 25px rgba(6,182,212,0.45);}
  
  .login-footer-info{font-size:11.5px;color:var(--muted);line-height:1.6;border-top:1px solid var(--line);padding-top:16px;}
  .version-tag{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:11px;letter-spacing:0.1em;color:var(--cyan);margin-top:6px;}

  <footer>{margin-top:26px;}
  .stats-bar{
    text-align:center;color:var(--muted);font-size:12.5px;
    font-family:'Space Grotesk',sans-serif;font-weight:600;margin-bottom:12px;
  }
  .backup-row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;}

  .theme-picker{position:relative;display:inline-block;}
  .theme-dropdown{
    position:absolute;top:calc(100% + 6px);right:0;z-index:20;
    background:#0d1411;border:1px solid var(--line);border-radius:10px;
    padding:8px;display:flex;gap:8px;
  }
  .theme-swatch{
    width:26px;height:26px;border-radius:50%;cursor:pointer;
    border:2px solid transparent;padding:0;
  }
  .theme-swatch.active{border-color:var(--cyan,#06b6d4);}

  .next-copy-btn, .create-form button, .extract-btn, .enter-dash-btn{
    background:var(--accent-grad)!important;
  }
</style>
</head>
<body>

<div id="loginModal">
  <div class="login-card">
    <div class="login-logo-circle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    </div>
    <div class="login-title">NUMBERBOX</div>
    <div class="login-subtitle">Personal Number Manager</div>
    
    <div class="input-group">
      <label>Email / Username</label>
      <div class="input-field-wrap">
        <input type="text" id="loginEmail" placeholder="Enter your email">
      </div>
    </div>

    <div class="input-group">
      <label>Password</label>
      <div class="input-field-wrap">
        <input type="password" id="loginPassword" placeholder="••••••••">
        <button type="button" class="eye-btn" id="togglePassEye" title="Show/Hide Password">👁</button>
      </div>
    </div>

    <div class="remember-row">
      <label class="checkbox-label">
        <input type="checkbox" id="rememberMeCheck" checked> Remember me
      </label>
      <span class="device-badge">🔒 Cached locally</span>
    </div>

    <button class="enter-dash-btn" id="submitLoginBtn">ACCESS DASHBOARD</button>

    <div class="login-footer-info">
      <div>⚡ Cloud Sync Enabled</div>
      <div class="version-tag">READY</div>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="brand">
    <div class="brand-left">
      <span id="userBanner">WORKSPACE</span>
      <div class="dot-row"><div class="dot b"></div><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div></div>
    </div>
    <div class="brand-right">
      <button class="toolbtn" id="uploadBtn">☁️ Upload</button>
      <button class="toolbtn" id="refreshBtn">🔄 Sync</button>
      <div class="theme-picker">
        <button class="toolbtn" id="themeToggleBtn" title="Change background theme">🎨</button>
        <div class="theme-dropdown" id="themeDropdown" style="display:none;">
          <button class="theme-swatch" data-theme="navy" style="background:#080b12;" title="Navy"></button>
          <button class="theme-swatch" data-theme="charcoal" style="background:#141414;" title="Charcoal"></button>
          <button class="theme-swatch" data-theme="slate" style="background:#0f1419;" title="Deep slate"></button>
          <button class="theme-swatch" data-theme="green" style="background:#0a0f0c;" title="Green-tinted black"></button>
        </div>
      </div>
      <button class="toolbtn" id="authBtn">🚪 Logout</button>
    </div>
  </div>

  <div class="sync-status-bar" id="syncStatusBar">
    <span id="syncStatus">Ready</span>
  </div>

  <!-- CATEGORY LIST VIEW -->
  <div id="listView">
    <h1>Categories</h1>

    <!-- Inline New Category Bar -->
    <div style="margin-bottom:12px;">
      <button class="toolbtn" id="newCategoryToggleBtn" style="background:var(--accent-grad);color:#06120e;font-weight:700;border:none;">＋ New Category</button>
      
      <div id="inlineCategoryBox" style="display:none;margin-top:8px;background:var(--card);border:1px solid var(--line);padding:12px;border-radius:12px;">
        <div style="font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;font-family:'Space Grotesk',sans-serif;">Create New Category</div>
        <div style="display:flex;gap:8px;">

<script>
function updateSyncProgress(done,total){
  const el=document.getElementById('syncStatus');
  const bar=document.getElementById('syncStatusBar');
  if(!el || !bar)return;
  bar.style.display='flex';
  const percent=total?Math.floor(done/total*100):100;
  el.textContent=`☁ Uploading ${done}/${total} (${percent}%)`;
}

const firebaseConfig = {
  apiKey: "AIzaSyC3dJg5jsogXSqr78zXpwtGcJCgwadcPlY",
  authDomain: "my-numbers-01.firebaseapp.com",
  projectId: "my-numbers-01",
  storageBucket: "my-numbers-01.firebasestorage.app",
  messagingSenderId: "796452751373",
  appId: "1:796452751373:web:938f5941f3de78acb62d44"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;
let categories = [];
let deleteMode = false; 
let selectedCategories = new Set();
let activeCategoryId = null;
let activeRangeFolderId = null;
let activeTransform = 'full';

const CRED_CACHE_KEY = 'secure_workspace_creds_v1';

function getUserCacheKey() {
  return currentUser ? `numberCategories_${currentUser.uid}` : 'numberCategories_guest';
}

function loadFromCache() {
  try {
    const raw = localStorage.getItem(getUserCacheKey());
    if (raw) categories = JSON.parse(raw);
    else categories = [];
  } catch (err) { categories = []; }
}

function saveToCache(data) {
  try { localStorage.setItem(getUserCacheKey(), JSON.stringify(data)); } catch (err) {}
}

function loadSavedCreds() {
  try {
    const saved = localStorage.getItem(CRED_CACHE_KEY);
    if (saved) {
      const data = JSON.parse(saved);
      document.getElementById('loginEmail').value = data.email || '';
      document.getElementById('loginPassword').value = data.password || '';
      document.getElementById('rememberMeCheck').checked = true;
    }
  } catch(e){}
}

let syncQueue = false;

function saveLocalImmediately(){
  try{
    localStorage.setItem(getUserCacheKey(), JSON.stringify(categories));
  }catch(e){}
}

async function backgroundSync(){
  if(syncQueue || !currentUser) return;
  syncQueue = true;
  const total = categories.length;
  let done = 0;
  showSyncStatus(total ? `☁ Uploading 0/${total}...` : '');
  try{
    for(const cat of categories){
      const { id, ...data } = cat;
      await db.collection("users").doc(currentUser.uid).collection("categories").doc(id).set(data);
      done++;
      updateSyncProgress(done, total);
    }
    showSyncStatus(total ? '☁ Synced ✓' : '');
    setTimeout(() => showSyncStatus(''), 2500);
  }catch(e){
    console.log("Sync error:", e);
    showSyncStatus('☁ Sync failed');
  }
  syncQueue = false;
}

function saveThenSync(cat){
  const index = categories.findIndex(c => c.id === cat.id);
  if(index >= 0) categories[index] = cat;
  else categories.unshift(cat);
  saveLocalImmediately();
  renderCategories();
  backgroundSync();
}

function showSyncStatus(text){
  const el=document.getElementById('syncStatus');
  const bar=document.getElementById('syncStatusBar');
  if(el && bar) {
    if(text){
      bar.style.display='flex';
      el.textContent=text;
    } else {
      bar.style.display='none';
    }
  }
}

async function refreshFromFirebase() {
  if (!currentUser) return;
  const refreshBtn = document.getElementById('refreshBtn');
  if (refreshBtn) refreshBtn.textContent = '⏳ Syncing...';
  showSyncStatus('☁ Syncing...');

  try {
    const querySnapshot = await db.collection("users").doc(currentUser.uid).collection("categories").get();
    const freshCategories = [];
    querySnapshot.forEach((docSnap) => {
      freshCategories.push({ id: docSnap.id, ...docSnap.data() });
    });

    categories = freshCategories;
    saveToCache(categories);
    renderCategories();
    if (activeCategoryId) openCategory(activeCategoryId, true);
    if (refreshBtn) refreshBtn.textContent = '✅ Updated';
    showSyncStatus('☁ Sync complete ✓');
  } catch (err) {
    if (refreshBtn) refreshBtn.textContent = '❌ Failed';
    showSyncStatus('☁ Sync failed');
  }

  setTimeout(() => { 
    if (refreshBtn) refreshBtn.textContent = '🔄 Sync'; 
    showSyncStatus('');
  }, 2000);
}

auth.onAuthStateChanged(async (user) => {
  currentUser = user;
  const loginModal = document.getElementById('loginModal');
  
  if (user) {
    loginModal.style.display = 'none';
    document.getElementById('userBanner').textContent = user.email.split('@')[0].toUpperCase();
    loadFromCache();
    renderCategories();
    await refreshFromFirebase();
  } else {
    loginModal.style.display = 'flex';
    loadSavedCreds();
    categories = [];
    renderCategories();
  }
});

document.getElementById('authBtn').addEventListener('click', async () => {
  await auth.signOut();
});

document.getElementById('togglePassEye').addEventListener('click', () => {
  const passInput = document.getElementById('loginPassword');
  passInput.type = passInput.type === 'password' ? 'text' : 'password';
});

document.getElementById('submitLoginBtn').addEventListener('click', async () => {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value.trim();
  const remember = document.getElementById('rememberMeCheck').checked;

  if (!email || !password) {
    alert('Please enter your email and password.');
    return;
  }

  try {
    await auth.signInWithEmailAndPassword(email, password);
    if (remember) {
      localStorage.setItem(CRED_CACHE_KEY, JSON.stringify({ email, password }));
    } else {
      localStorage.removeItem(CRED_CACHE_KEY);
    }
  } catch (err) {
    alert('Login failed: ' + err.message);
  }
});

async function saveCategoryToCloud(cat) {
  if (!currentUser) return;
  const index = categories.findIndex(c => c.id === cat.id);
  if (index > -1) categories[index] = cat;
  else categories.unshift(cat);
  
  saveToCache(categories);
  renderCategories();
  backgroundSync();
}

async function deleteCategoryFromCloud(catId) {
  if (!currentUser) return;
  categories = categories.filter(c => c.id !== catId);
  saveToCache(categories);
  renderCategories();
  await db.collection("users").doc(currentUser.uid).collection("categories").doc(catId).delete();
}

function uid(){ return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function transformValue(v, t){
  if(t === 'plus') return v.startsWith('+') ? v : '+' + v;
  if(t === 'strip2') return v.length > 2 ? v.slice(2) : v;
  if(t === 'strip3') return v.length > 3 ? v.slice(3) : v;
  return v;
}

function formatTimestamp(ts){
  if(!ts) return '';
  const d = new Date(ts);
  return `${d.toLocaleDateString(undefined, { day: '2-digit', month: 'short' })}, ${d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' })}`;
}

function openDeleteMode(){ deleteMode = true; selectedCategories.clear(); document.getElementById('categoryDeletePanel').style.display = 'block'; renderCategories(); } 
function cancelDeleteMode(){ deleteMode = false; selectedCategories.clear(); document.getElementById('categoryDeletePanel').style.display = 'none'; renderCategories(); } 
async function deleteSelectedCategories(){ if(selectedCategories.size === 0){ alert("Select categories first."); return; } if(!confirm(`Delete ${selectedCategories.size} selected category(s)?`)) return; const remove = categories.filter(c => selectedCategories.has(c.id)); categories = categories.filter(c => !selectedCategories.has(c.id)); saveToCache(categories); renderCategories(); if(currentUser){ for(const c of remove){ await db.collection("users").doc(currentUser.uid).collection("categories").doc(c.id).delete(); } } cancelDeleteMode(); }

// Inline New Category Toggle & Actions
const newCategoryToggleBtn = document.getElementById('newCategoryToggleBtn');
const inlineCategoryBox = document.getElementById('inlineCategoryBox');
const inlineCategoryNameInput = document.getElementById('inlineCategoryNameInput');
const inlineCategoryCreateBtn = document.getElementById('inlineCategoryCreateBtn');
const inlineCategoryCancelBtn = document.getElementById('inlineCategoryCancelBtn');

newCategoryToggleBtn.addEventListener('click', () => {
  const isHidden = inlineCategoryBox.style.display === 'none';
  inlineCategoryBox.style.display = isHidden ? 'block' : 'none';
  if(isHidden) inlineCategoryNameInput.focus();
});

inlineCategoryCancelBtn.addEventListener('click', () => {
  inlineCategoryBox.style.display = 'none';
  inlineCategoryNameInput.value = '';
});

inlineCategoryCreateBtn.addEventListener('click', () => {
  const name = inlineCategoryNameInput.value.trim();
  if(!name) return;
  
  if(categories.some(c => c.name.toLowerCase() === name.toLowerCase())){
    alert("A category with this name already exists.");
    return;
  }

  const newCat = {
    id: uid(),
    name: name,
    rangeFolders: [],
    updatedAt: Date.now()
  };
  saveThenSync(newCat);
  inlineCategoryNameInput.value = '';
  inlineCategoryBox.style.display = 'none';
});

function renderCategories(){
  const listEl = document.getElementById('categoryList');
  const query = document.getElementById('searchInput').value.trim().toLowerCase();
  const filtered = categories
    .filter(c => c.name.toLowerCase().includes(query))
    .sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }));

  updateStats();

  if(categories.length === 0){
    listEl.innerHTML = '<div class="empty">No categories found. Click "New Category" to create one.</div>';
    return;
  }
  if(filtered.length === 0){
    listEl.innerHTML = '<div class="empty">No categories match search.</div>';
    return;
  }

  listEl.innerHTML = '';
  filtered.forEach(cat => {
    const totalNums = (cat.rangeFolders || []).reduce((sum, rf) => sum + (rf.numbers ? rf.numbers.length : 0), 0);
    const subLabel = `${(cat.rangeFolders || []).length} range folder(s) · ${totalNums} numbers`;
    
    const card = document.createElement('div');
    card.className = 'folder-card';

    if(deleteMode){ 
      card.style.cursor = "pointer"; 
      if(selectedCategories.has(cat.id)){ 
        card.style.borderColor = 'var(--cyan)'; 
        card.style.background = 'rgba(6,182,212,0.15)'; 
      } 
    }
    
    card.innerHTML = `
      <div class="folder-main">
        <span class="folder-dot"></span>
        <div class="folder-text">
          <div class="folder-name-row">
            <span class="folder-name"></span>
          </div>
          <div class="folder-sub"></div>
        </div>
      </div>
      <div class="folder-right">
        <span class="folder-count">${(cat.rangeFolders || []).length}</span>
        <span class="folder-chevron">&rsaquo;</span>
        <button class="folder-del" title="Delete category">&#10005;</button>
      </div>
    `;
    card.querySelector('.folder-name').textContent = cat.name;
    card.querySelector('.folder-sub').textContent = subLabel;
    
    card.querySelector('.folder-del').addEventListener('click', (e) => {
      e.stopPropagation();
      if(confirm(`Delete category "${cat.name}" and all its range folders?`)) deleteCategoryFromCloud(cat.id);
    });
    
    card.addEventListener('click', () => { 
      if(deleteMode){ 
        if(selectedCategories.has(cat.id)){ selectedCategories.delete(cat.id); }
        else{ selectedCategories.add(cat.id); } 
        renderCategories(); 
      } else { 
        openCategory(cat.id); 
      } 
    });
    listEl.appendChild(card);
  });
}

document.getElementById('searchInput').addEventListener('input', renderCategories);

const bulkDeleteBtn = document.getElementById('bulkDeleteBtn');
if (bulkDeleteBtn) {
  bulkDeleteBtn.addEventListener('click', openDeleteMode);
}

document.getElementById('selectAllCategoriesBtn').addEventListener('click',()=>{ categories.forEach(c=>selectedCategories.add(c.id)); renderCategories(); }); 
document.getElementById('deleteSelectedCategoriesBtn').addEventListener('click',deleteSelectedCategories); 
document.getElementById('cancelDeleteBtn').addEventListener('click',cancelDeleteMode);

function getActiveCategory(){ return categories.find(c => c.id === activeCategoryId); }

function openCategory(id, preserveState = false){
  activeCategoryId = id;
  const cat = getActiveCategory();
  if(!cat) return;

  if(!preserveState) {
    document.getElementById('listView').style.display = 'none';
    document.getElementById('categoryView').style.display = 'block';
  }
  document.getElementById('categoryTitle').textContent = cat.name;
  renderRangeFolders();
}

// Inline New Range Folder inside a Category
const newRangeFolderToggleBtn = document.getElementById('newRangeFolderToggleBtn');
const inlineRangeFolderBox = document.getElementById('inlineRangeFolderBox');
const inlineRangeFolderNameInput = document.getElementById('inlineRangeFolderNameInput');
const inlineRangeFolderCreateBtn = document.getElementById('inlineRangeFolderCreateBtn');
const inlineRangeFolderCancelBtn = document.getElementById('inlineRangeFolderCancelBtn');

newRangeFolderToggleBtn.addEventListener('click', () => {
  const isHidden = inlineRangeFolderBox.style.display === 'none';
  inlineRangeFolderBox.style.display = isHidden ? 'block' : 'none';
  if(isHidden) inlineRangeFolderNameInput.focus();
});

inlineRangeFolderCancelBtn.addEventListener('click', () => {
  inlineRangeFolderBox.style.display = 'none';
  inlineRangeFolderNameInput.value = '';
});

inlineRangeFolderCreateBtn.addEventListener('click', () => {
  const name = inlineRangeFolderNameInput.value.trim();
  if(!name) return;
  const cat = getActiveCategory();
  if(!cat) return;

  if(!cat.rangeFolders) cat.rangeFolders = [];
  if(cat.rangeFolders.some(rf => rf.name.toLowerCase() === name.toLowerCase())){
    alert("A range folder with this name already exists in this category.");
    return;
  }

  cat.rangeFolders.push({
    id: uid(),
    name: name,
    numbers: [],
    currentIndex: 0,
    updatedAt: Date.now()
  });

  cat.updatedAt = Date.now();
  saveCategoryToCloud(cat);
  inlineRangeFolderNameInput.value = '';
  inlineRangeFolderBox.style.display = 'none';
  renderRangeFolders();
});

function renderRangeFolders(){
  const cat = getActiveCategory();
  const listEl = document.getElementById('rangeFolderList');
  if(!cat) return;

  if(!cat.rangeFolders || cat.rangeFolders.length === 0){
    listEl.innerHTML = '<div class="empty">No range folders in this category. Click "Create Range Folder" to add one.</div>';
    return;
  }

  listEl.innerHTML = '';
  cat.rangeFolders.forEach(rf => {
    const card = document.createElement('div');
    card.className = 'folder-card';
    card.innerHTML = `
      <div class="folder-main">
        <span class="folder-dot"></span>
        <div class="folder-text">
          <div class="folder-name-row">
            <span class="folder-name"></span>
          </div>
          <div class="folder-sub"></div>
        </div>
      </div>
      <div class="folder-right">
        <span class="folder-count">${rf.numbers ? rf.numbers.length : 0}</span>
        <span class="folder-chevron">&rsaquo;</span>
        <button class="folder-del" title="Delete range folder">&#10005;</button>
      </div>
    `;
    card.querySelector('.folder-name').textContent = rf.name;
    card.querySelector('.folder-sub').textContent = `Updated ${formatTimestamp(rf.updatedAt)}`;

    card.querySelector('.folder-del').addEventListener('click', (e) => {
      e.stopPropagation();
      if(confirm(`Delete range folder "${rf.name}"?`)){
        cat.rangeFolders = cat.rangeFolders.filter(item => item.id !== rf.id);
        cat.updatedAt = Date.now();
        saveCategoryToCloud(cat);
        renderRangeFolders();
      }
    });

    card.addEventListener('click', () => {
      openRangeFolder(rf.id);
    });

    listEl.appendChild(card);
  });
}

function openRangeFolder(rfId){
  activeRangeFolderId = rfId;
  const cat = getActiveCategory();
  const rf = cat.rangeFolders.find(r => r.id === rfId);
  if(!rf) return;

  activeTransform = 'full';
  document.querySelectorAll('.cc-btn').forEach(b => b.classList.toggle('active', b.dataset.t === 'full'));
  
  document.getElementById('categoryView').style.display = 'none';
  document.getElementById('folderView').style.display = 'block';
  document.getElementById('folderTitle').textContent = `${cat.name} / ${rf.name}`;
  renderFolder();
}

function getActiveRangeFolder(){
  const cat = getActiveCategory();
  if(!cat || !cat.rangeFolders) return null;
  return cat.rangeFolders.find(rf => rf.id === activeRangeFolderId);
}

function updateAutoPos(){
  const posEl = document.getElementById('autoPos');
  const rf = getActiveRangeFolder();
  if(!posEl || !rf) return;
  if(!rf.numbers || rf.numbers.length === 0){ posEl.textContent = '0 / 0'; return; }
  const shown = Math.min((rf.currentIndex || 0) + 1, rf.numbers.length);
  posEl.textContent = `${shown} / ${rf.numbers.length}`;
}

function scrollToCurrentRow(smooth = true){
  const listEl = document.getElementById('numList');
  const activeRow = listEl.querySelector('.num-row.current-copy');
  if(activeRow){
    const topPos = activeRow.offsetTop - listEl.offsetTop - (listEl.clientHeight / 2) + (activeRow.clientHeight / 2);
    listEl.scrollTo({ top: Math.max(0, topPos), behavior: smooth ? 'smooth' : 'auto' });
  }
}

function renderFolder(){
  const rf = getActiveRangeFolder();
  if(!rf) return;
  document.getElementById('folderCount').textContent = (rf.numbers || []).length.toLocaleString();

  if(rf.currentIndex === undefined) rf.currentIndex = 0;

  const listEl = document.getElementById('numList');
  listEl.innerHTML = '';

  if(!rf.numbers || rf.numbers.length === 0){
    listEl.innerHTML = '<div class="empty">No numbers in this range folder. Extract numbers below.</div>';
    updateAutoPos();
    return;
  }

  const frag = document.createDocumentFragment();
  rf.numbers.forEach((entry, i) => {
    const displayVal = transformValue(entry.value, activeTransform);
    const row = document.createElement('div');
    row.className = 'num-row';

    if(i === rf.currentIndex){
      row.classList.add('current-copy');
    } else if(entry.status === 'copied'){
      row.classList.add('previous-copy');
    }

    let tagText = '';
    if(i === rf.currentIndex || entry.status === 'copied'){
      tagText = 'copied';
    }

    row.innerHTML = `
      <span class="num-idx">${i + 1}</span>
      <span class="num-val">${displayVal}</span>
      ${entry.isNew ? '<span class="new-badge">NEW</span>' : ''}
      <span class="copied-tag">${tagText}</span>
    `;

    row.addEventListener('click', () => {
      navigator.clipboard.writeText(displayVal);
      
      rf.numbers.forEach((item, idx) => {
        if(idx === rf.currentIndex && item.status !== 'copied'){
          item.status = 'copied';
        }
      });

      rf.currentIndex = i;
      entry.status = 'copied';
      const newBadge = row.querySelector('.new-badge');
      if(newBadge) newBadge.remove();
      if(entry.isNew){
        entry.isNew = false;
      }
      rf.updatedAt = Date.now();
      saveCategoryToCloud(getActiveCategory());
      renderFolder();
    });

    frag.appendChild(row);
  });
  listEl.appendChild(frag);

  updateAutoPos();
  scrollToCurrentRow(false);
}

document.getElementById('backToCategoriesBtn').addEventListener('click', () => {
  activeCategoryId = null;
  document.getElementById('categoryView').style.display = 'none';
  document.getElementById('listView').style.display = 'block';
  renderCategories();
});

document.getElementById('backBtn').addEventListener('click', () => {
  activeRangeFolderId = null;
  document.getElementById('folderView').style.display = 'none';
  document.getElementById('categoryView').style.display = 'block';
  renderRangeFolders();
});

document.getElementById('nextCopyBtn').addEventListener('click', () => {
  const rf = getActiveRangeFolder();
  if(!rf || !rf.numbers || rf.numbers.length === 0) return;
  
  if(rf.currentIndex === undefined) rf.currentIndex = 0;
  if(rf.currentIndex >= rf.numbers.length) rf.currentIndex = 0;
  
  const entry = rf.numbers[rf.currentIndex];
  const displayVal = transformValue(entry.value, activeTransform);
  navigator.clipboard.writeText(displayVal);
  
  entry.status = 'copied';
  if(entry.isNew){
    entry.isNew = false;
  }

  rf.currentIndex++;
  if(rf.currentIndex >= rf.numbers.length){
    rf.currentIndex = 0;
  }

  rf.updatedAt = Date.now();
  saveCategoryToCloud(getActiveCategory());
  renderFolder();
});

document.getElementById('autoResetBtn').addEventListener('click', () => {
  const rf = getActiveRangeFolder();
  if(!rf) return;
  rf.currentIndex = 0;
  rf.updatedAt = Date.now();
  saveCategoryToCloud(getActiveCategory());
  renderFolder();
});

document.getElementById('clearCopyBtn').addEventListener('click', () => {
  const rf = getActiveRangeFolder();
  if(!rf || !rf.numbers) return;
  rf.numbers.forEach(item => {
    item.status = '';
  });
  rf.currentIndex = 0;
  rf.updatedAt = Date.now();
  saveCategoryToCloud(getActiveCategory());
  renderFolder();
});

  const dlAnchorElem = document.createElement('a');

document.getElementById('importAllInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const imported = JSON.parse(e.target.result);
      if(Array.isArray(imported)){
        if(confirm(`Restore ${imported.length} categories? This will upload them to your account.`)){
          for (const cat of imported) {
            saveThenSync(cat);
          }
          alert('Restore complete!');
        }
      }
    } catch (err) { alert('Invalid backup file'); }
  };
  reader.readAsText(file);
  e.target.value = '';
});

document.getElementById('importFileInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(!file) return;
  document.getElementById('importFileNameLabel').textContent = file.name;
  const reader = new FileReader();
  reader.onload = (evt) => {
    let data = evt.target.result;
    document.getElementById('importInput').value = data;
  };
  reader.readAsText(file);
});

document.getElementById('showImportBtn').addEventListener('click', () => {
  const box = document.getElementById('importBox');
  const arrow = document.getElementById('importArrow');
  const open = box.style.display === 'none';
  box.style.display = open ? 'block' : 'none';
  arrow.textContent = open ? '▴' : '▾';
});

document.getElementById('extractBtn').addEventListener('click', async () => {
  const rf = getActiveRangeFolder();
  if(!rf){
    alert('Please open a range folder first before extracting numbers.');
    return;
  }
  
  const text = document.getElementById('importInput').value;
  if(!text.trim()){
    alert('Please paste some text to extract.');
    return;
  }

  const allNums = text.match(/\b\d{9,15}\b/g) || [];
  if(allNums.length === 0){
    alert('No valid numbers found in the pasted text.');
    return;
  }

  if(!rf.numbers) rf.numbers = [];

  const existing = new Set(rf.numbers.map(n => n.value));
  let addedCount = 0;

  allNums.forEach(v => {
    if(!existing.has(v)){
      existing.add(v);
      rf.numbers.push({ value: v, isNew: true, status: '' });
      addedCount++;
    }
  });

  rf.updatedAt = Date.now();
  saveCategoryToCloud(getActiveCategory());

  alert(`Successfully extracted and added ${addedCount} new number(s) to range folder "${rf.name}"!`);
  document.getElementById('importInput').value = document.getElementById('importFileNameLabel').textContent = '';
  document.getElementById('importBox').style.display = 'none';
  document.getElementById('importArrow').textContent = '▾';
  renderFolder();
});

function updateStats(){
  const bar = document.getElementById('statsBar');
  if(!bar) return;
  const totalCategories = categories.length;
  const totalRangeFolders = categories.reduce((sum, c) => sum + (c.rangeFolders ? c.rangeFolders.length : 0), 0);
  const totalNumbers = categories.reduce((sum, c) => sum + (c.rangeFolders || []).reduce((s, rf) => s + (rf.numbers ? rf.numbers.length : 0), 0), 0);
  bar.textContent = `${totalCategories} category(s) · ${totalRangeFolders} range folder(s) · ${totalNumbers} number(s)`;
}

document.getElementById('uploadBtn').addEventListener('click', async () => {

  if(categories.length === 0){ alert('Nothing to upload yet.'); return; }
  const btn = document.getElementById('uploadBtn');

});

const THEME_KEY = 'numberBoxTheme';

function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  document.querySelectorAll('.theme-swatch').forEach(sw => {
    sw.classList.toggle('active', sw.dataset.theme === theme);
  });
}

document.getElementById('themeToggleBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  const dd = document.getElementById('themeDropdown');
  dd.style.display = dd.style.display === 'none' ? 'flex' : 'none';
});

document.querySelectorAll('.theme-swatch').forEach(sw => {
  sw.addEventListener('click', () => {
    const theme = sw.dataset.theme;
    applyTheme(theme);
    try{ localStorage.setItem(THEME_KEY, theme); }catch(e){}
    document.getElementById('themeDropdown').style.display = 'none';
  });
});

document.addEventListener('click', (e) => {
  const picker = document.querySelector('.theme-picker');
  if(picker && !picker.contains(e.target)){
    document.getElementById('themeDropdown').style.display = 'none';
  }
});

(function initTheme(){
  let saved = 'navy';
  try{ saved = localStorage.getItem(THEME_KEY) || 'navy'; }catch(e){}
  applyTheme(saved);
})();

autoLoginCheck();
